[versions]
# ---------------------------------------------------------------------------
# 版本策略（遵循 Android-MD3-Knowledge/07/compose-coding-rules.md V2：
# 版本号只从官方来源取；以下每条注明来源与核验状态）。
# 2026-11-16 更新：为接入 M3 Expressive 组件，切换到 compose-bom-alpha，
# 使 material3 升至 1.5.0-rc01（Expressive 组件自 1.5.0-alpha23 起大多转正，
# 仅 LoadingIndicator 家族与 MaterialShapes 仍为 experimental）。
# ---------------------------------------------------------------------------

# AGP：9.4.1（本机 Gradle 缓存已有；满足 Compose 1.12+ 的 AGP 9.2.0+ 前置要求，
# 据 Android Developers Blog，知识库 00/version-tracking.md 转录）
agp = "9.4.1"

# Kotlin：2.3.21（本机 Gradle 缓存已有；compose/serialization 插件与 Kotlin 同版本）
kotlin = "2.3.21"

# Compose BOM（alpha 线）：2026.11.00 → material3 1.5.0-rc01
# 核验（2026-11-16）：dl.google.com 官方 Maven 下载 compose-bom-alpha POM，
# 其中 androidx.compose.material3:material3 = 1.5.0-rc01；
# androidx.compose.material3.adaptive:adaptive = 1.4.0-alpha03。
# 注意：官方版本表尚未将 1.5.0 标为 stable（知识库 version-tracking.md 待核验项），
# 属预发布线，生产项目需回归后再切。
composeBom = "2026.11.00"

# 已核验稳定版（官方 Maven / release notes / 官方文档页，核验日期 2026-11-16）：
coreKtx = "1.18.0"            # developer.android.com 稳定版频道页，2026-03-16
activityCompose = "1.13.0"    # developer.android.com Activity release notes，2026-03-11
lifecycle = "2.11.0"          # developer.android.com Lifecycle release notes，2026-06-17
navigationCompose = "2.10.2"  # 官方 release notes / Maven 索引，2026-09-24
datastore = "1.2.1"           # developer.android.com 稳定版频道页，2026-03-16
serializationJson = "1.9.0"   # Maven Central（本机缓存已有该版本）

# 测试依赖（官方 Maven 可达，核验 2026-11-16）
coroutinesTest = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose 一律走 BOM，不写单 artifact 版本号（规则 V1）。
# BOM-alpha 提供 Expressive 所需的 material3 1.5.0-rc01。
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom-alpha", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# 规则 V3：图标依赖显式声明，优先只引 core
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 窗口尺寸类：currentWindowAdaptiveInfo()（03/adaptive-layout.md 推荐路径）
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }

androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# createSavedStateHandle() 定义于 lifecycle-viewmodel-savedstate（核验 sources jar，2026-11-16）
androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
junit = { group = "junit", name = "junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
