name: Sync compose-samples index

# 只同步元数据（commit / 文件统计 / 主题路径），不拉源码。
# 原因见 04-Official-Samples/README.md：上游约 100MB，镜像会让知识库仓库膨胀且必然过期。

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout knowledge base
        uses: actions/checkout@v4

      - name: Update index from upstream
        env:
          UPSTREAM: android/compose-samples
        run: python3 .github/scripts/sync_samples.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04-Official-Samples/
          git diff --cached --quiet || (git commit -m "chore: sync compose-samples index" && git push)
